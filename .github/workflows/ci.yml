name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: agentwriter
          POSTGRES_PASSWORD: agentwriter_ci_only
          POSTGRES_DB: agentwriter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentwriter -d agentwriter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PYTHONPATH: src
      TEST_DATABASE_URL: postgresql://agentwriter:agentwriter_ci_only@127.0.0.1:5432/agentwriter_test
      TEMP: /tmp
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install reviewed Python runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Check public repository boundary
        run: python scripts/check_publication.py

      - name: Check locked dependencies against public advisory metadata
        run: python scripts/audit_dependencies.py requirements-dev.lock --output .local/dependency-audit.json

      - name: Install hashed development lock
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-dev.lock

      - name: Static checks
        run: |
          python -m ruff check --no-cache src tests scripts
          python -m mypy

      - name: Fixture smoke
        run: python scripts/smoke.py

      - name: Versioned fixture evaluation
        run: python scripts/evaluate.py --baseline evaluation/corpus/v1/baseline.json --output .local/evaluation.json

      - name: Full test suite against disposable PostgreSQL
        run: python -B -m pytest -q -p no:cacheprovider --tb=short
